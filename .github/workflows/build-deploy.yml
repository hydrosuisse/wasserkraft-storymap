name: Build and deploy story

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"     # daily, ~07:17/08:17 Swiss time (after the BFE update)
  workflow_dispatch:

permissions:
  contents: write            # commit the refreshed data snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2   # reads DESCRIPTION

      - name: Build site
        run: Rscript build.R

      - name: Save data snapshot (fallback for the next build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "Update BFE data snapshot"
          git push || echo "snapshot not pushed"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
